name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install pyTelegramBotAPI requests cryptography

      - name: Check shell script syntax
        run: |
          # setup_nfqws.sh уезжает на роутеры покупателей и имеет shebang /bin/sh,
          # поэтому проверяем именно POSIX-интерпретатором (dash), а не bash.
          sh -n setup_nfqws.sh
          bash -n setup_vps.sh
          bash -n deploy/update.sh
          bash -n deploy/install.sh

      - name: Compile all modules
        run: |
          python -m py_compile telegram_bot.py support_bot.py keenetic_config_generator.py sni_manager.py
          python -m py_compile test_crypto_payment.py test_dpi_flow.py test_handlers.py test_menu_flow.py test_stars_payment.py test_support.py test_support_bot.py test_security_and_p2.py test_defense_paths.py test_config_generator.py test_landing_html.py

      - name: Run tests individually
        run: |
          for t in test_menu_flow.py test_crypto_payment.py test_stars_payment.py test_support.py test_handlers.py test_dpi_flow.py test_support_bot.py test_security_and_p2.py test_defense_paths.py test_config_generator.py test_landing_html.py; do
            echo "=== $t ==="
            if out=$(python -u "$t" 2>&1); then
              echo "PASS $t"
            else
              echo "::error ::FAILED $t"
              printf '%s\n' "$out" | tail -n 25 | sed 's/^/::error ::/'
              exit 1
            fi
          done